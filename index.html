<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة ثانوية · مدرسين 3 ثانوي · داكن</title>
    
    <!-- ===== SEO = 0 (إخفاء من محركات البحث) ===== -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <link rel="canonical" href="#" />

    <!-- Google Fonts + Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0b0e17;
            color: #eef2ff;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 30px;
            color: #f1f5f9;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
            border: 1px solid #2d3a4f;
            width: 100%;
        }
        .header h1 {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: 1px;
        }
        .header h1 i {
            color: #60a5fa;
        }
        .header p {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            opacity: 0.8;
            margin-top: 8px;
        }

        /* ===== SUBJECT CARD ===== */
        .subject-card {
            background: #141b26;
            border-radius: 24px;
            padding: 24px 28px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #26303f;
            transition: 0.2s;
            width: 100%;
        }
        .subject-card:hover {
            border-color: #3b4a62;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        .subject-title {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .subject-title i {
            color: #60a5fa;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
        }

        .subject-divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            margin: 6px 0 20px 0;
        }

        /* ===== TEACHER ROW ===== */
        .teacher-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            padding: 14px 16px;
            background: #1e2735;
            border-radius: 16px;
            margin-bottom: 12px;
            border-right: 4px solid #3b82f6;
            transition: 0.15s;
            width: 100%;
        }
        .teacher-row:hover {
            background: #283240;
            border-right-color: #60a5fa;
        }
        .teacher-row:last-child {
            margin-bottom: 0;
        }

        .teacher-name {
            font-weight: 700;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            color: #f1f5f9;
            flex: 1 1 140px;
            min-width: 120px;
        }
        .teacher-name i {
            color: #60a5fa;
            margin-left: 8px;
            font-size: 0.9rem;
        }

        .teacher-price {
            background: #1e3a5f;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            color: #93c5fd;
            white-space: nowrap;
            border: 1px solid #2d4a78;
            flex-shrink: 0;
        }

        .teacher-link {
            background: #2563eb;
            color: #fff;
            padding: 7px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            flex-shrink: 0;
        }
        .teacher-link:hover {
            background: #3b82f6;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
        .teacher-link i {
            font-size: 0.8rem;
        }

        .no-teachers {
            color: #94a3b8;
            font-style: italic;
            padding: 10px 0;
        }

        /* ===== FOOTER ===== */
        .footer-note {
            text-align: center;
            margin-top: 40px;
            color: #64748b;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            padding: 20px;
            border-top: 1px solid #26303f;
            width: 100%;
        }
        .footer-note i {
            color: #60a5fa;
        }

        /* ===== RESPONSIVE - يتكيف مع أي شاشة ===== */
        @media (max-width: 768px) {
            body {
                padding: 15px 12px;
            }
            .subject-card {
                padding: 18px 16px;
            }
            .teacher-row {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px 14px;
                padding: 12px 14px;
            }
            .teacher-name {
                flex: 1 1 100%;
                min-width: 100%;
            }
            .teacher-price {
                flex: 0 1 auto;
            }
            .teacher-link {
                flex: 0 1 auto;
                margin-right: auto;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px 8px;
            }
            .header {
                padding: 20px 15px;
                margin-bottom: 25px;
            }
            .subject-card {
                padding: 14px 12px;
                margin-bottom: 20px;
            }
            .teacher-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 12px;
            }
            .teacher-name {
                flex: 1 1 auto;
                min-width: unset;
            }
            .teacher-price {
                align-self: flex-start;
            }
            .teacher-link {
                margin-right: 0;
                justify-content: center;
                width: 100%;
            }
            .subject-divider {
                width: 40px;
            }
        }

        /* ===== ACCESSIBILITY ===== */
        ::selection {
            background: #3b82f6;
            color: #fff;
        }
        a {
            color: #93c5fd;
        }

        .teacher-link:focus-visible {
            outline: 3px solid #60a5fa;
            outline-offset: 4px;
        }
        .teacher-row:focus-within {
            border-right-color: #facc15;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1><i aria-hidden="true"></i> افضل مدرسين اونلاين</h1>
            <p>اختر مادتك وشوف المدرسين المتاحين مع السعر واللينك · داكن</p>
        </header>

        <!-- SUBJECTS + TEACHERS -->
        <main id="subjectsContainer" role="main"></main>

        <footer class="footer-note">
            <i class="fas fa-graduation-cap" aria-hidden="true"></i> كل المدرسين متخصصين في 3 ثانوي · بالتوفيق يا أبطال 🏆
        </footer>

    </div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        const subjectsData = [
            {
                name: "اللغة العربية",
                icon: "fa-solid fa-book",
                teachers: [
                    { name: "مستر رضا فاروق", price: "460 ج.م / ٣ شهور", url: "https://mrredaelfarouk.com" },
                    { name: "مستر محمد صلاح", price: "450 ج.م / ٣ شهور", url: "https://bassthalk.com" }
                ]
            },
            {
                name: "اللغة الإنجليزية",
                icon: "fa-solid fa-language",
                teachers: [
                    { name: "مستر عبقري لغة", price: "480 ج.م / ٣ شهور", url: "https://ahmed-tarek.net" },
                    { name: "مستر انجلشاوي", price: "500 ج.م / ٣ شهور", url: "https://www.mrenglishawy.com/ar/dashboard" }
                ]
            },
            {
                name: "الكيمياء",
                icon: "fa-solid fa-calculator",
                teachers: [
                    { name: "مستر خالد صقر", price: "الاكونت مش راضي يتعمل ف مش هعرف السعر", url: "https://khaled-sakr.com" },
                    { name: "مستر محمد عبد الجواد", price: "الاكونت مش راضي يتعمل ف مش هعرف السعر", url: "https://magacademy.co" }
                ]
            },
            {
                name: "الفيزياء",
                icon: "fa-solid fa-atom",
                teachers: [
                    { name: "مستر محمد عبد المعبود", price: "505 ج.م / ٣ شهور", url: "https://abdelmaaboud.com" },
                    { name: "مستر كيرلس القس", price: "425 ج.م / ٣ شهور", url: "https://www.doctorinphysics.com" }
                ]
            },
            {
                name: "الاحياء",
                icon: "fa-solid fa-flask",
                teachers: [
                    { name: "مستر احمد الجوهري", price: "في كذا سعر للاسف لازم تسأل حد علمي علوم علشان معرفش", url: "https://ahmed-elgohary.com" }
                ]
            }
        ];

        // ============================================================
        //  RENDER
        // ============================================================
        function renderAll() {
            const container = document.getElementById('subjectsContainer');
            let html = '';

            subjectsData.forEach(subject => {
                html += `
                    <section class="subject-card">
                        <h2 class="subject-title">
                            <i class="${subject.icon}" aria-hidden="true"></i> ${subject.name}
                        </h2>
                        <div class="subject-divider" aria-hidden="true"></div>
                `;

                if (subject.teachers.length === 0) {
                    html += `<div class="no-teachers">❌ مفيش مدرسين متاحين حالياً</div>`;
                } else {
                    subject.teachers.forEach((teacher) => {
                        html += `
                            <div class="teacher-row">
                                <span class="teacher-name"><i class="fas fa-chalkboard-teacher" aria-hidden="true"></i> ${teacher.name}</span>
                                <span class="teacher-price">${teacher.price}</span>
                                <a href="${teacher.url}" target="_blank" rel="noopener noreferrer" class="teacher-link" aria-label="شوف كورس ${teacher.name}">
                                    <i class="fas fa-external-link-alt" aria-hidden="true"></i> شوف الكورس
                                </a>
                            </div>
                        `;
                    });
                }

                html += `</section>`;
            });

            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', renderAll);
    </script>

</body>
</html>
